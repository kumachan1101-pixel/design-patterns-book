name: build-and-run

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 全フォルダをビルドして実行する（make）
        run: |
          set -e
          fail=0
          for d in $(find . -name Makefile -printf '%h\n' | sort); do
            echo "==== $d"
            make -C "$d" -s run || fail=1
          done
          exit $fail

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: run.bat と同じスクリプトで全件を実行する
        shell: cmd
        run: volume01\run.bat all
